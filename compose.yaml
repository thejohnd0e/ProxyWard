# Run: docker compose up -d --build   (optional settings: see .env.example)
# The port is published only on the LAN address you name, never on 0.0.0.0.

name: proxyward

services:
  proxyward:
    build: .
    image: proxyward:local
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-8080}:8080"
    environment:
      # Set to true only when the interface is reached over HTTPS (for example behind a TLS proxy).
      PROXYWARD_SESSION_SECURE: "${SESSION_SECURE:-false}"
    volumes:
      - proxyward-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  proxyward-data:
