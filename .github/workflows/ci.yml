name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  # All jobs share a pinned image instead of ubuntu-latest, which now resolves
  # to Ubuntu 26.04. Playwright 1.56.1 in web/package.json has no browser
  # dependencies for 26.04, so its install step fails there. Revisit after
  # upgrading Playwright to a release that supports 26.04.
  go:
    name: Go tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test with the race detector
        run: go test -race -count=1 ./...

  web:
    name: Web interface
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - name: Type check
        run: npm --prefix web run typecheck
      - name: Unit and component tests
        run: npm --prefix web test
      - name: Build
        run: npm --prefix web run build
      - name: Embed web assets for the local E2E fixture
        run: node scripts/build-web.mjs
      - name: Install pinned Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser tests against local fixtures
        working-directory: web
        env:
          CI: true
          E2E_BROWSER_CHANNEL: chromium
        run: npm run e2e

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build image
        run: docker build -t proxyward:ci .
